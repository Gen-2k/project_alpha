packages:
  - "apps/*"
  - "packages/*"

# Build scripts: scarf is install-time telemetry from @nestjs/swagger's
# dependency tree — explicitly NOT run (the package works without it).
allowBuilds:
  "@scarf/scarf": false
  esbuild: true

# Transitive security pins (Dependabot alerts).
# These packages are never direct dependencies, so a catalog entry cannot
# reach them:
#   - vite comes in as auto-installed peer of vitest; 8.3.3+ carries the
#     launch-editor fixes (GHSA-587h-7wmj-h5pm, GHSA-698v-4r3x-3vcv,
#     GHSA-r825-w8mm-5pxw). 8.3.4 is the newest release past minimumReleaseAge.
#   - source-map-js 1.2.2 fixes GHSA-68fv-2mgg-jv7q via postcss/magicast.
#   - esbuild 0.18.20 is pinned exactly by @esbuild-kit/core-utils (drizzle-kit);
#     0.25.12 is already in the tree through drizzle-kit itself and fixes
#     GHSA-67mh-4wv8-2f99.
overrides:
  "esbuild@<0.25.0": 0.25.12
  "source-map-js@<1.2.2": 1.2.2
  "vite@>=8.3.0 <8.3.3": 8.3.4

# Accepted audit exception: braces <=3.0.3 has no patched release (npm's latest
# is 3.0.3; the advisory's ">=3.0.4" was never published). It is reachable only
# from dev tooling (knip, eslint-plugin-check-file), never from the runtime
# image. Revisit when a patched release appears. See ADR-011.
audit:
  ignore:
    - GHSA-vfj7-8cjw-p6xm

# Shared version catalog (pnpm official "Catalogs" feature).
# Each entry is the single source of truth for that dependency's range:
# upgrading means editing one line here instead of every package.json.
# Usage: "typescript": "catalog:"
# Add entries (react, drizzle, …) when the first app/package needs them.
catalog:
  typescript: ^6.0.0
  eslint: ^9.34.0
  # NestJS platform (single range for all @nestjs/* keeps majors in lockstep)
  "@nestjs/common": ^12.1.2
  "@nestjs/core": ^12.1.2
  "@nestjs/platform-express": ^12.1.2
  "@nestjs/cli": ^12.0.8
  "@nestjs/schematics": ^12.0.6
  "@nestjs/config": ^12.0.1
  "@nestjs/swagger": ^12.0.2
  "@nestjs/jwt": ^12.0.2
  "@nestjs/schedule": ^12.0.2
  "@nestjs/throttler": ^6.7.1
  bcryptjs: ^3.0.3
  cookie-parser: ^1.4.7
  helmet: ^8.0.0
  ms: ^2.0.0
  nodemailer: ^10.0.0
  zod: ^4.6.5
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  # Logging layer (Pino + NestJS integration)
  nestjs-pino: ^5.3.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  "@types/cookie-parser": ^1.4.10
  "@types/express": ^5.0.0
  "@types/ms": ^2.1.0
  "@types/node": ^24.0.0
  "@types/nodemailer": ^8.0.2

  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "@vitest/ui": ^5.0.5
  eslint-plugin-check-file: ^3.3.2
  # Database layer (Drizzle ORM + postgres-js driver + drizzle-kit CLI)
  drizzle-orm: ^0.45.0
  drizzle-kit: ^0.31.0
  postgres: ^3.4.0
  dotenv: ^18.0.6

  # CLI tooling, AST parsing, and terminal UI
  "@babel/parser": ^8.0.7
  "@babel/traverse": ^8.0.7
  "@babel/generator": ^8.0.6
  "@babel/types": ^8.0.6
  "@types/babel__generator": ^7.6.8
  "@types/babel__traverse": ^7.20.6
  commander: ^15.0.0
  picocolors: ^1.1.1
  "@formatjs/icu-messageformat-parser": ^3.0.0

# pnpm recorded this exception automatically: @nestjs/swagger@12.0.2 was
# newer than minimumReleaseAge when first installed. Revisit on upgrades.
minimumReleaseAgeExclude:
  - "@nestjs/swagger@12.0.2"
  - nestjs-pino@5.2.1
