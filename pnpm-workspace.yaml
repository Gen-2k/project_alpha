packages:
  - "apps/*"
  - "packages/*"

# Build scripts: scarf is install-time telemetry from @nestjs/swagger's
# dependency tree — explicitly NOT run (the package works without it).
allowBuilds:
  "@scarf/scarf": false
  esbuild: true

# Shared version catalog (pnpm official "Catalogs" feature).
# Each entry is the single source of truth for that dependency's range:
# upgrading means editing one line here instead of every package.json.
# Usage: "typescript": "catalog:"
# Add entries (react, drizzle, …) when the first app/package needs them.
catalog:
  typescript: ^6.0.0
  eslint: ^9.34.0
  # NestJS platform (single range for all @nestjs/* keeps majors in lockstep)
  "@nestjs/common": ^12.1.2
  "@nestjs/core": ^12.1.2
  "@nestjs/platform-express": ^12.1.2
  "@nestjs/cli": ^12.0.8
  "@nestjs/schematics": ^12.0.6
  "@nestjs/config": ^12.0.1
  "@nestjs/swagger": ^12.0.2
  "@nestjs/jwt": ^12.0.2
  "@nestjs/schedule": ^12.0.2
  "@nestjs/throttler": ^6.7.1
  bcryptjs: ^3.0.3
  cookie-parser: ^1.4.7
  helmet: ^8.0.0
  ms: ^2.0.0
  nodemailer: ^10.0.0
  zod: ^4.6.5
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1
  # Logging layer (Pino + NestJS integration)
  nestjs-pino: ^5.2.1
  pino: ^10.3.1
  pino-http: ^11.0.0
  pino-pretty: ^13.1.3
  "@types/cookie-parser": ^1.4.10
  "@types/express": ^5.0.0
  "@types/ms": ^2.1.0
  "@types/node": ^24.0.0
  "@types/nodemailer": ^8.0.2

  vitest: ^4.1.2
  "@vitest/coverage-v8": ^4.1.2
  "@vitest/ui": ^4.1.2
  eslint-plugin-check-file: ^3.3.2
  # Database layer (Drizzle ORM + postgres-js driver + drizzle-kit CLI)
  drizzle-orm: ^0.45.0
  drizzle-kit: ^0.31.0
  postgres: ^3.4.0
  dotenv: ^18.0.6

  # CLI tooling, AST parsing, and terminal UI
  "@babel/parser": ^8.0.7
  "@babel/traverse": ^8.0.7
  "@babel/generator": ^8.0.6
  "@babel/types": ^8.0.6
  "@types/babel__generator": ^7.6.8
  "@types/babel__traverse": ^7.20.6
  commander: ^15.0.0
  picocolors: ^1.1.1
  "@formatjs/icu-messageformat-parser": ^3.0.0

# pnpm recorded this exception automatically: @nestjs/swagger@12.0.2 was
# newer than minimumReleaseAge when first installed. Revisit on upgrades.
minimumReleaseAgeExclude:
  - "@nestjs/swagger@12.0.2"
  - nestjs-pino@5.2.1
