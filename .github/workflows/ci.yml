name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel intermediate runs on PRs, but allow pushes on main to complete.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  quality:
    name: Quality (Format, Lint, Duplication, Dead Code)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-quality-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-quality-${{ runner.os }}-

      - name: Code Formatting Check (Prettier)
        run: pnpm format:check

      - name: Workspace Lint (ESLint via Turbo)
        run: pnpm lint

      - name: Root Configs Lint
        run: pnpm lint:root

      - name: Code Duplication Budget (JSCPD <= 5%)
        run: pnpm jscpd

      - name: Dead Code & Unused Exports (Knip)
        run: pnpm knip

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-typecheck-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-typecheck-${{ runner.os }}-

      - name: TypeScript Compilation Check
        run: pnpm typecheck

  test:
    name: Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-test-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-test-${{ runner.os }}-

      - name: Peer Dependencies Check
        run: pnpm peers check

      - name: Test Suite with Coverage Enforcement
        run: pnpm test:cov

  build:
    name: Monorepo Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turbo Cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-build-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-build-${{ runner.os }}-

      - name: Compile Packages and Apps
        run: pnpm build

  security:
    name: Security & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Dependency Vulnerability Audit (Critical CVEs)
        run: pnpm audit --audit-level=critical

      - name: Secret Leak Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Image Build Proof
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Build Server Image (Multi-Stage Proof)
        run: docker build -f apps/server/Dockerfile --build-arg APP_VERSION=${{ github.sha }} .

  ci-gate:
    name: CI Gate
    runs-on: ubuntu-latest
    needs: [quality, typecheck, test, build, security, docker]
    if: always()
    steps:
      - name: Evaluate Pipeline Status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "CI pipeline failed. One or more upstream jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI pipeline jobs passed successfully."
